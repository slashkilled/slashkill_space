---
layout: default
title: "slashkill | music"
section_title: "music"
section_subtitle: "(lyrics)"
field_char: "♪"
---

{% for post in site.posts %}
  {% if post.category == "music" %}
    <article class="post">
      <div class="post-line">
        <span class="post-date">{{ post.date | date: "%Y.%m.%d" }}</span>
        <span class="terminal-prompt">&gt;&#95;&#8203;&#95;</span>
        <span class="post-text">{{ post.content }}</span>
      </div>
    </article>
  {% endif %}
{% endfor %}
