backend:
  name: github
  repo: slashkilled/slashkill_space
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Записи"
    folder: "_posts"
    create: true
    # Явно указываем короткий шаблон имени. 
    # Теперь сюда НИКОГДА не попадет текст поста, только дата и случайный ID.
    slug: "{{year}}-{{month}}-{{day}}-{{shortid}}"
    identifier_field: "date"
    format: "frontmatter"
    fields:
      - {label: "Текст поста", name: "body", widget: "markdown"}
      - {label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Категория", name: "category", widget: "select", options: ["shitposting", "music"]}
