backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "assets/uploads" # Куда будут сохраняться картинки
public_folder: "/assets/uploads" # Путь для их отображения на сайте

collections:
  - name: "posts"
    label: "Записи"
    folder: "_posts"
    create: true
    format: "frontmatter"
    fields:
      - {label: "Заголовок / Текст", name: "body", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss Z"}
      - {label: "Категория", name: "category", widget: "select", options: ["shitposting", "music"]}
