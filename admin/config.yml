backend:
  name: github
  repo: slashkilled/slashkill_space
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Записи"
    folder: "_posts"
    create: true
    # Жесткий шаблон: имя файла ВСЕГДА будет состоять только из даты и случайного ID. 
    # Текст поста сюда физически не попадет, какой бы длины он ни был.
    slug: "{{year}}-{{month}}-{{day}}-{{shortid}}"
    identifier_field: "date"
    format: "frontmatter"
    fields:
      - {label: "Текст поста", name: "body", widget: "markdown"}
      - {label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Категория", name: "category", widget: "select", options: ["shitposting", "music"]}
