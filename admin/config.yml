backend:
  name: github
  repo: slashkilled/slashkill_space
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Записи"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Текст поста", name: "body", widget: "text"}
      - {label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Категория", name: "category", widget: "select", options: ["shitposting", "music"]}
